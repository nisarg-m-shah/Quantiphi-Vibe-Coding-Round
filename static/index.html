<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI Chat Assistant</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 30%, #0f2a20, #0a0f0d 60%); color: #e6f2ec;
      font-family: Inter, system-ui, sans-serif; text-align: center; padding: 24px; }
    .card { max-width: 560px; padding: 48px 36px; border: 1px solid #1d2b24; border-radius: 28px;
      background: #0f1713; box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: up .6s ease both; }
    @keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: #10b981; box-shadow: 0 0 16px #10b981; margin: 0 auto 18px; }
    h1 { font-size: 34px; margin: 0 0 12px; background: linear-gradient(90deg, #34d399, #10b981);
      -webkit-background-clip: text; color: transparent; }
    p { color: #7e948a; line-height: 1.6; margin: 0 0 28px; }
    .tags { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 28px; }
    .tags span { font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 1px solid #1d2b24; color: #34d399; }
    a.cta { display: inline-block; padding: 14px 32px; border-radius: 999px; background: #10b981; color: #04130d;
      font-weight: 600; text-decoration: none; transition: .2s; box-shadow: 0 6px 20px rgba(16,185,129,.4); }
    a.cta:hover { transform: translateY(-2px); background: #34d399; }
  </style>
</head>
<body>
  <div class="card">
    <div class="dot"></div>
    <h1>AI Chat Assistant</h1>
    <p>A streaming chat assistant with saved conversation history and a tone of your choice.</p>
    <div class="tags"><span>Live streaming</span><span>Saved history</span><span>Professional · Casual · Concise</span></div>
    <a class="cta" href="/chat.html">Start chatting →</a>
  </div>
</body>
</html>
